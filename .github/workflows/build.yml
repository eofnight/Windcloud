name: Test and build desktop clients
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: pnpm test
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS archives and signatures
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import subprocess, tempfile
          archives = list(Path('release').glob('*.zip'))
          assert len(archives) == 1, archives
          for archive in archives:
              with tempfile.TemporaryDirectory(prefix='windcloud-signature-') as folder:
                  subprocess.run(['ditto', '-xk', str(archive), folder], check=True)
                  subprocess.run(['node', 'scripts/verify-mac-signature.cjs', str(Path(folder) / 'Windcloud Client.app')], check=True)
          for image in Path('release').glob('*.dmg'):
              subprocess.run(['hdiutil', 'verify', str(image)], check=True)
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: windcloud-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
