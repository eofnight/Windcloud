name: Publish packaged release
on:
  workflow_run:
    workflows: [Test and build desktop clients]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main build run ID
        required: true
        type: string
      tag:
        description: Version tag matching package.json in the build
        required: true
        default: v0.3.5
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || 'v0.3.5' }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_commit.message, 'Release:'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      TAG: ${{ inputs.tag || 'v0.3.5' }}
    steps:
      - name: Verify source build and version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '.status == "completed" and .conclusion == "success" and .event == "push" and .head_branch == "main" and .head_repository.full_name == $repo and .path == ".github/workflows/build.yml"' run.json
          source_sha=$(jq -r .head_sha run.json)
          package_version=$(gh api "repos/$GH_REPO/contents/package.json?ref=$source_sha" --jq .content | base64 --decode | jq -r .version)
          test "$TAG" = "v$package_version"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Download all three verified platform artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name windcloud-win-x64 --dir artifacts/windows
          gh run download "$RUN_ID" --name windcloud-mac-arm64 --dir artifacts/mac-arm64
          gh run download "$RUN_ID" --name windcloud-mac-x64 --dir artifacts/mac-x64
      - name: Validate and checksum installers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, zipfile
          root = pathlib.Path('artifacts')
          target = pathlib.Path('assets')
          target.mkdir()
          expected = {'windows': {'.exe'}, 'mac-arm64': {'.dmg', '.zip'}, 'mac-x64': {'.dmg', '.zip'}}
          for platform, extensions in expected.items():
              files = list((root / platform).iterdir())
              assert len(files) == len(extensions), (platform, files)
              assert {p.suffix for p in files} == extensions, platform
              for p in files:
                  assert p.is_file() and not p.is_symlink() and p.stat().st_size > 0, p
                  assert os.environ['TAG'][1:] in p.name, p
                  asset_name = p.name.replace(' ', '.')
                  assert not (target / asset_name).exists(), p
                  if p.suffix == '.zip':
                      with zipfile.ZipFile(p) as z:
                          assert z.testzip() is None, p
                  shutil.copy2(p, target / asset_name)
          with (target / 'SHA256SUMS.txt').open('w') as checksums:
              for p in sorted(target.iterdir()):
                  if p.name != 'SHA256SUMS.txt':
                      checksums.write(f'{hashlib.file_digest(p.open("rb"), "sha256").hexdigest()}  {p.name}\n')
          PY
      - name: Publish complete preview release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          風雲再起桌面客戶端預覽版。

          - Windows x64：下載 .exe 安裝檔。
          - macOS Apple Silicon：下載檔名含 arm64 的 .dmg 或 .zip。
          - macOS Intel：下載檔名不含 arm64 的 .dmg 或 .zip。
          - 新增最多三組具名計時器，可選單次或循環，設定秒數與執行指令。
          - 支援 #ti+ 名稱／#ti- 名稱，省略名稱時操作全部；隱藏面板不會停止計時。
          - 計時器沿用觸發器腳本語法，可用 Alias、變數、條件與 #WA；共用既有單一等待佇列。
          - 斷線或重開後計時器保持停止，需手動啟動；錯誤僅停止受影響的計時器。
          - 指令教學獨立整理到 docs/commands.md，README 保留安裝與功能概覽。
          - macOS 延續 ad-hoc 本機簽章與 Hardened Runtime；首次開啟可能需在隱私權與安全性中授權。

          三個平台均已通過自動測試及打包；SHA256SUMS.txt 提供檔案核對碼。此版採用 ad-hoc 本機簽章，未使用 Apple Developer ID，亦未經 Apple 公證。
          NOTES
          printf '\n指令教學：https://github.com/%s/blob/%s/docs/commands.md\n' "$GH_REPO" "$SOURCE_SHA" >> notes.md
          printf '\n來源建置：https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$RUN_ID" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A retry can repair checksums without replacing any installer.
            remote_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
            gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$remote_sha" > release-compare.json
            jq -e '.status == "ahead" or .status == "identical"' release-compare.json
            jq -e '[.files[] | select(.filename != ".github/workflows/release.yml")] | length == 0' release-compare.json
            gh api "repos/$GH_REPO/releases/tags/$TAG" > existing-release.json
            python3 - <<'PYRELEASE'
          import hashlib, json, pathlib
          remote = json.loads(pathlib.Path('existing-release.json').read_text())
          assets = {a['name']: a for a in remote['assets']}
          local = [p for p in pathlib.Path('assets').iterdir() if p.name != 'SHA256SUMS.txt']
          assert set(assets) - {'SHA256SUMS.txt'} == {p.name for p in local}
          for p in local:
              assert assets[p.name]['size'] == p.stat().st_size
              digest = assets[p.name].get('digest')
              if digest:
                  assert digest == 'sha256:' + hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()
          PYRELEASE
            gh release upload "$TAG" assets/SHA256SUMS.txt --clobber
          else
            # Creating a new tag with GITHUB_TOKEN requires the current default-branch head.
            # Only release-workflow changes may differ from the tested source build.
            release_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$release_sha" > release-compare.json
            jq -e '.status == "ahead" or .status == "identical"' release-compare.json
            jq -e '[.files[] | select(.filename != ".github/workflows/release.yml")] | length == 0' release-compare.json
            gh release create "$TAG" --target "$release_sha" --title "風雲再起 $TAG" --notes-file notes.md --draft --prerelease assets/*
          fi
          gh release edit "$TAG" --draft=false
